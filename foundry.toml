[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]
# The tests read the checked-in feed rounds and the live-probe fixture.
fs_permissions = [{ access = "read", path = "./data" }]

[rpc_endpoints]
base = "https://mainnet.base.org"

[lint]
lint_on_build = false
